<!doctype html>

      type="image/png"
    />
    <style>
      .section {
        padding: 25px !important;
      }
    </style>

  <body>
    <!-- HEADER (igual ao index) -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="/Ração de Canto/index.html" class="logo">
          <img src="/Ração de Canto/assets/images/Logo.png" class="logo-paw" />
          <span class="logo-text">Ração<em>de Canto</em></span>
        </a>

        <nav class="nav-primary">
          <ul class="nav-list">
            <li>
              <a href="/Ração de Canto/index.html#sobre" class="nav-link"
                >Sobre</a
              >
            </li>
            <li>
              <a href="/Ração de Canto/index.html#pets" class="nav-link"
                >Pets</a
              >
            </li>
          </ul>
        </nav>

        <button class="nav-toggle"></button>
      </div>
    </header>

    <main>
      <!-- HERO DA GALERIA -->
      <section class="section">
        <div class="container section-header">
          <span class="section-label">Momentos do Projeto</span>
          <h1 class="section-title">Nossa <em>Galeria</em></h1>
          <p class="section-subtitle">
            Cada imagem carrega uma história de resgate, cuidado e amor.
          </p>
        </div>
      </section>

      <!-- GALERIA -->
      <section class="section">
        <div class="container">
          <div class="galeria-grid">
            <!-- ITEM -->

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel 1.jpeg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel 2.jpeg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Foto Pétala.png"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel 3.jpeg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel de protetor de pescoço.jpeg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel abandonado.jpg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel descansando.jpg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Fiel repousando.jpeg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Foto Pétala - Brincando.jpg"
                class="galeria-img"
                alt=""
              />
            </div>

            <div class="galeria-item">
              <img
                src="/Ração de Canto/assets/images/Pet/Galeria/Foto Pétala - Descansando.jpg"
                class="galeria-img"
                alt=""
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      /* ══════════════════════════════════════════════════════════
     7. GALERIA — LIGHTBOX
     [SEC-V04] Valida protocolo da URL antes de atribuir src
  ══════════════════════════════════════════════════════════ */
      const galeriaItems = document.querySelectorAll(".galeria-item");

      const lightbox = document.createElement("div");
      lightbox.className = "lightbox";
      lightbox.setAttribute("role", "dialog");
      lightbox.setAttribute("aria-modal", "true");
      lightbox.setAttribute("aria-label", "Visualizar imagem");

      lightbox.innerHTML = `
    <div class="lightbox-overlay"></div>
    <div class="lightbox-content">
      <button class="lightbox-prev" aria-label="Imagem anterior">‹</button>
      <img class="lightbox-img" src="" alt="" />
      <button class="lightbox-next" aria-label="Próxima imagem">›</button>
      <button class="lightbox-close" aria-label="Fechar">×</button>
    </div>
  `;
      document.body.appendChild(lightbox);

      const lbImg = lightbox.querySelector(".lightbox-img");
      const lbClose = lightbox.querySelector(".lightbox-close");
      const lbPrev = lightbox.querySelector(".lightbox-prev");
      const lbNext = lightbox.querySelector(".lightbox-next");
      const lbOverlay = lightbox.querySelector(".lightbox-overlay");

      let currentIndex = 0;
      const images = [];

      galeriaItems.forEach((item, idx) => {
        const img = item.querySelector(".galeria-img");
        if (img) {
          images.push({ src: img.src, alt: img.alt });

          item.setAttribute("tabindex", "0");
          item.setAttribute("role", "button");
          item.setAttribute("aria-label", `Ampliar: ${img.alt}`);

          const openLightbox = () => {
            currentIndex = idx;
            showLightbox(idx);
          };
          item.addEventListener("click", openLightbox);
          item.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openLightbox();
            }
          });
        }
      });

      function isValidImgSrc(src) {
        try {
          const url = new URL(src, window.location.origin);
          return ["http:", "https:", "data:", "blob:"].includes(url.protocol);
        } catch {
          return false;
        }
      }

      function showLightbox(idx) {
        const { src, alt } = images[idx] || {};
        if (!src || !isValidImgSrc(src)) return;

        lbImg.src = src;
        lbImg.alt = alt || "";
        lightbox.classList.add("lightbox--open");
        document.body.style.overflow = "hidden";

        // Foco no close
        setTimeout(() => lbClose.focus(), 50);

        lbPrev.style.display = images.length > 1 ? "" : "none";
        lbNext.style.display = images.length > 1 ? "" : "none";
      }

      function closeLightbox() {
        lightbox.classList.remove("lightbox--open");
        document.body.style.overflow = "";
        lbImg.src = "";
        // Devolver foco
        const trigger = galeriaItems[currentIndex];
        if (trigger) trigger.focus();
      }

      lbClose.addEventListener("click", closeLightbox);
      lbOverlay.addEventListener("click", closeLightbox);

      lbPrev.addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showLightbox(currentIndex);
      });
      lbNext.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % images.length;
        showLightbox(currentIndex);
      });

      lightbox.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") {
          currentIndex = (currentIndex - 1 + images.length) % images.length;
          showLightbox(currentIndex);
        }
        if (e.key === "ArrowRight") {
          currentIndex = (currentIndex + 1) % images.length;
          showLightbox(currentIndex);
        }
      });
    </script>
  </body>
</html>
